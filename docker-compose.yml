name: online-store

services:
  postgres:
    image: postgres:15-alpine
    container_name: online-store-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-online_store_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-online_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-online_store_user} -d ${POSTGRES_DB:-online_store}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: online-store-backend
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-online_store_user}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-online_store}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - FRONTEND_URL=http://localhost:3000
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: online-store-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: online_store_postgres_data